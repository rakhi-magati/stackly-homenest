<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Nest</title><link rel="stylesheet" href="css/style.css"></head><body data-page="login"><header id="hdr"></header>
<div class="split"><form class="form" id="lf" novalidate><h1>Welcome back!</h1><p style="color:var(--mut)">Sign in to continue exploring amazing properties.</p>
<div class="f"><label for="em">Email or mobile number</label><input id="em" autocomplete="username" placeholder="you@email.com or 10-digit number"><span class="err">Enter a valid email or 10-digit mobile number.</span></div>
<div class="f"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" placeholder="At least 6 characters"><span class="err">Password needs 6 or more characters.</span></div>
<p style="margin:12px 0;display:flex;justify-content:space-between"><label><input type="checkbox"> Remember me</label><a href="#" id="pw" style="color:var(--blue)">Show / hide password</a></p>
<button class="btn p w">Login</button><p style="text-align:center;color:var(--mut);margin:14px 0">Or continue with</p>
<div class="soc"><button type="button" class="btn">Google</button><button type="button" class="btn">Facebook</button><button type="button" class="btn">Apple</button></div>
<p>Don't have an account? <a href="#" style="color:var(--blue)" onclick="toast('Just log in: any valid details create your account');return false">Sign up</a></p></form>
<div class="art login-photo"><h2>Your dream home is just a login away</h2><svg viewBox="0 0 300 180" preserveAspectRatio="xMidYMax slice"><rect y="140" width="300" height="40" fill="#2f6b3f"/><rect x="60" y="70" width="170" height="72" fill="#f3f1ec"/><rect x="50" y="62" width="190" height="10" fill="#222"/><g fill="#9fd3ff"><rect x="80" y="86" width="40" height="40"/><rect x="170" y="86" width="40" height="40"/></g></svg></div></div>
<script src="js/app.js"></script></body></html>
